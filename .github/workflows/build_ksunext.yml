name: Build KernelSU-Next A50s
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Unduh Source Kernel
        uses: actions/checkout@v4
        with:
          depth: 1

      - name: Pasang Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Suntikkan KernelSU-Next
        run: |
          curl -LSs "https://githubusercontent.com" | bash -s legacy

      - name: Kompilasi Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make O=out exynos9610-a50sdd_defconfig
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KPROBES=y" >> out/.config
          echo "CONFIG_HAVE_KPROBES=y" >> out/.config
          echo "CONFIG_KPROBE_EVENTS=y" >> out/.config
          make -j$(nproc) O=out

      - name: Upload Hasil
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-A50s
          path: out/arch/arm64/boot/Image*
